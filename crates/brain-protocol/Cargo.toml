[package]
name = "brain-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Wire protocol (frame format, opcodes, codec) for Brain."

[dependencies]
brain-core = { path = "../brain-core" }
crc32c.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
uuid.workspace = true
# SmallVec used by Statement / EvidenceRef projections.
smallvec.workspace = true
# serde + serde_json used by the value-typed schema AST.
serde = { workspace = true }
# Encodes fixed `[u8; N]` UUID-shaped wire fields as CBOR byte strings.
serde_bytes.workspace = true
# Portable CBOR wire payload encoding + integer-discriminant enum encoding.
ciborium.workspace = true
serde_repr.workspace = true
serde_json = { workspace = true }
# pest-based parser for the schema DSL.
pest = { workspace = true }
pest_derive = { workspace = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "frame_codec"
harness = false
