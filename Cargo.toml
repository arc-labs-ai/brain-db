# Workspace root for the Brain cognitive substrate.
#
# Individual crates live under crates/. Add new members both here and in
# the relevant CLAUDE.md section.

[workspace]
resolver = "2"
members = [
    "crates/brain-core",
    "crates/brain-crypto",
    "crates/brain-protocol",
    "crates/brain-storage",
    "crates/brain-metadata",
    "crates/brain-index",
    "crates/brain-embed",
    "crates/brain-rerank",
    "crates/brain-planner",
    "crates/brain-extractors",
    "crates/brain-plugins",
    "crates/brain-llm",
    "crates/brain-ops",
    "crates/brain-workers",
    "crates/brain-server",
    "crates/brain-http",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
version = "0.4.2" # x-release-please-version
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/arc-labs-ai/brain-db"
# This repo ships the server (as a git tag + Docker image), not crates.io
# packages — the SDKs live in sibling repos. Gate every member crate against an
# accidental `cargo publish`; flip a specific crate's inherited value if one is
# ever intended for crates.io.
publish = false

# Centralize dependency versions here. Crates inherit with `dep.workspace = true`.
[workspace.dependencies]
# Async / runtime
glommio = "0.9"
tokio = { version = "1", features = [
    "net",
    "sync",
    "time",
    "signal",
    "macros",
    "io-util",
    "rt-multi-thread",
] }
# rustls 0.23 bundles `aws-lc-rs` as its default crypto provider; we
# install it at startup. TLS 1.2 is not permitted; TLS 1.3 only. We also
# restrict via `ServerConfig::with_protocol_versions`.
rustls = { version = "0.23.45", default-features = false, features = [
    "std",
    "logging",
    "aws-lc-rs",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
] }
rustls-pemfile = "2"
rcgen = "0.13"
socket2 = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# Runtime-agnostic mpsc (used at the Tokio↔Glommio shard boundary).
flume = { version = "0.11", default-features = false, features = [
    "async",
    "select",
] }
futures-lite = "2"

# HTTP stack (brain-http). hyper handles HTTP/1.1 wire codec,
# keep-alive, chunked transfer, body backpressure. http / http-body /
# http-body-util are the version-neutral vocabulary so HTTP/2 can slot
# in later via a feature flag without touching handlers.
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.5", default-features = false }
hyper-util = { version = "0.1", default-features = false }
# WebSocket framing + masking + close-handshake (used in M6).
tokio-tungstenite = { version = "0.21", default-features = false, features = [
    "stream",
    "connect",
    "handshake",
] }
# Stream trait (used by sse::SseStream and body::stream). transitively
# pulled by tokio already; declared here for hygiene.
futures-core = "0.3"
# Pin projection without `unsafe`. Standard for hand-rolling Body
# impls; used by tokio, hyper, axum, et al. ~150 LOC proc-macro.
pin-project-lite = "0.2"
# tokio adapters: ReceiverStream/UnboundedReceiverStream — used by
# tests and by application producers that wire bounded mpsc to SSE.
tokio-stream = "0.1"
# WebSocket Sec-WebSocket-Accept derivation per RFC 6455 §4.2.2.
sha1 = "0.10"
base64 = "0.22"
# WebSocket tests: drive the protocol from the futures-side `Sink`
# and `Stream` traits.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
rkyv = { version = "0.8", features = ["bytecheck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
# Encodes fixed `[u8; N]` and `Vec<u8>` wire fields as CBOR byte strings
# (major type 2) rather than serde's default integer arrays, so a
# third-party client reading "16-byte id" from the spec produces
# byte-identical bytes.
serde_bytes = "0.11"
# Portable, self-describing wire payload encoding (RFC 8949 CBOR). Pure-Rust,
# serde-native. Replaces rkyv on the wire so any language can speak the
# protocol from the spec alone; rkyv stays for internal on-disk storage.
ciborium = "0.2"
serde_json = "1"
toml = "0.8"
# Schema DSL parser — PEG grammar for `schema.brain`.
pest = "2.7"
pest_derive = "2.7"
# Pattern extractor — regex over memory text.
regex = "1"
# Lexical tokenizer. Direct deps so the brain-side
# analyzer can call rust-stemmers + unicode-normalization without
# leaning on tantivy's re-exports.
rust-stemmers = "1"
unicode-normalization = "0.1"
# LLM extractor — validate structured JSON responses
# against the operator-declared draft-7 JSON schema.
jsonschema = { version = "0.18", default-features = false }

# Storage / indexing
# Pinned, not a range. redb 4.6.0 fires an internal debug assertion in
# `page_manager.rs` (`!read_page_ref_counts.contains_key(&page)` during
# `process_data_freed_pages_after_commit`) on the workload exercised by
# `brain_metadata::llm_cache::tests::sweep_retains_live_sibling_with_same_hash_different_expiry`.
# Bisected: that test passes on 4.1.0 and fails on 4.6.0, with no other
# change. The assertion is in redb's page reference counting, so the
# failure is about page lifetime accounting rather than anything this
# workspace does. 4.6.0 measured no faster on the write path, so there is
# nothing to trade for it. Lift the pin only once that test passes.
redb = "=4.1.0"
hnsw_rs = "0.3"
# Lexical retrieval. We opt out of the default
# `stopwords` feature because the retrieval contract binds "no stop-word
# removal in v1" (preserves exact-ID queries like ACME-1247);
# `mmap` + `lz4-compression` + `stemmer` are kept.
tantivy = { version = "0.26", default-features = false, features = [
    "mmap",
    "stemmer",
    "lz4-compression",
] }

# Embeddings (pure-Rust)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"

# Math / SIMD
matrixmultiply = "0.3"
wide = "0.7"
# Holographic Reduced Representations (brain-planner::vsa) bind/unbind
# are circular convolutions; we lean on rustfft's well-tuned radix-N
# planner. Pure-Rust, no external BLAS/FFTW link.
rustfft = "6"

# Concurrency primitives
arc-swap = "1"
rayon = "1.12"
parking_lot = "0.12"

# Caches
lru = "0.12"

# Small-vector inline storage — used for evidence inline arrays
# (≤ 8 entries) on Statement.
smallvec = { version = "1", features = ["const_generics", "union", "serde"] }

# Hashing / IDs
blake3 = "1"
# Sealing tenant LLM provider keys at rest (brain-crypto). aws-lc-rs is
# already linked as the rustls crypto provider, so the AEAD here is the
# same implementation the TLS listener uses.
aws-lc-rs = { version = "1.18", default-features = false, features = [
    "aws-lc-sys",
] }
zeroize = "1.8"
crc32c = "0.6"
uuid = { version = "1.7", features = ["v5", "v7", "serde"] }

# Errors
thiserror = "1"
anyhow = "1"

# Syscalls (mmap/mremap/munmap/fallocate/msync/madvise — used by brain-storage).
libc = "0.2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry stack — OTel is the distributed-tracing transport.
# Version matrix for opentelemetry 0.24:
#   opentelemetry_sdk      = 0.24
#   opentelemetry-otlp     = 0.17   (own version scheme)
#   opentelemetry-semantic-conventions = 0.16
#   tracing-opentelemetry  = 0.25
# Pinning explicitly because cross-crate version mismatches in this
# stack are the #1 reported papercut.
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-client",
    "reqwest-rustls",
] }
opentelemetry-semantic-conventions = "0.16"
tracing-opentelemetry = "0.25"

# Time
time = { version = "0.3", features = ["serde", "formatting"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tempfile = "3"

[profile.dev]
opt-level = 0
# Line-tables only, not full debuginfo. `cargo test`/`nextest` link the heavy
# integration-test binaries (e.g. brain-server's, ~250 dep rlibs) under this
# profile; full debuginfo makes a single `ld` invocation exceed the dev
# container's ~8 GiB ceiling and the linker is OOM-killed (signal 9), so the
# test suite can't even build. Line tables keep panic backtraces with
# file:line while shrinking the link enough to fit. For an interactive
# debugging session that needs full locals, override transiently with
# `RUSTFLAGS="-C debuginfo=2"` or bump the container's RAM.
debug = "line-tables-only"

[profile.release]
opt-level = 3
debug = 1         # keep symbols for profiling
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 1
