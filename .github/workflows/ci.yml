name: CI

# `push` fires for main only. dev is deliberately NOT a push trigger: while a
# dev -> main release PR is open, dev is that PR's head, so every merge into
# dev raised TWO runs of this workflow on one SHA — a `push:dev` run and a
# `pull_request:dev` run — which doubled CI cost and made the PR check list
# show each job twice (the loser cancelled by the concurrency group, rendered
# as a red x beside its green twin). Work reaching dev is already gated by the
# feature -> dev PR that merged it and by the standing dev -> main PR, both of
# which run under `pull_request` on the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Fork PRs get a read-only GITHUB_TOKEN by default under this trigger, so
# adding pull_request here doesn't expose secrets to untrusted code.
permissions:
  contents: read

# Cancel a stale PR run when a newer commit lands — no point finishing CI for a
# diff that's already superseded. Pushes to the release branches (main, dev) are
# NOT cancelled: a rapid burst of pushes during release prep would otherwise kill
# each in-flight run before it finishes, so CI never reaches green even though
# nothing is broken. Those runs must complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Use the Ubuntu 26 compatibility compiler only for C sources; assembly
      # sources must not receive the Linux header injection.
      CC: ${{ github.workspace }}/.github/scripts/cc-ubuntu26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (workspace)
        run: cargo build --workspace --all-targets

      # Run tests only (--lib --bins --tests), NOT benches: criterion bench
      # harnesses reject `--test-threads` and are operator-run perf tools, not
      # CI gates (they stay compile-checked by the build step's --all-targets).
      # Sequential link (`-j 1`) — the release-shaped link graph OOMs the 7 GB
      # runner when N test binaries link in parallel. `--test-threads=1` keeps
      # RUNTIME memory bounded: brain-server integration tests each spin up a
      # shard + load the embedding model, and running them in parallel within a
      # binary SIGKILLs the runner. `--no-fail-fast` so one crate's red test
      # doesn't mask regressions elsewhere.
      - name: Test (workspace, sequential link)
        run: cargo test --workspace --lib --bins --tests --no-fail-fast -j 1 -- --test-threads=1

      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Clippy
        run: cargo clippy --workspace --tests --all-features -- -D warnings

      - name: Cargo doc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # Smoke-asserts the shipped binaries link in release mode. Catches
      # regressions where a debug-only path masks a release-only failure
      # (LTO / codegen-units=1 / panic=abort interactions).
      - name: Release build smoke (brain-server)
        run: cargo build --release --bin brain-server

  miri:
    name: Miri (storage layer)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # The byte-logic tests miri DOES run (slot/payload) use proptest, which
      # calls getcwd for its failure-persistence file; default miri isolation
      # blocks that. Disable isolation so getcwd/fs/timers work — miri still
      # checks UB. The mmap/WAL modules miri genuinely can't model stay gated
      # behind #[cfg(all(test, not(miri)))].
      MIRIFLAGS: -Zmiri-disable-isolation
      CC: ${{ github.workspace }}/.github/scripts/cc-ubuntu26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
      - name: Miri test
        # --lib only: miri checks the unsafe byte-logic units (slot/record/
        # payload layout + CRC). The integration tests (tests/*.rs) drive real
        # arena/WAL file I/O (mmap, fallocate) that miri cannot model; they're
        # covered by the normal Test job.
        run: cargo +nightly miri test -p brain-storage --lib

  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # Prebuilt, checksum-verified binary instead of `cargo install
      # --locked` (which compiles cargo-audit and its deps from source on
      # every run) — seconds instead of minutes.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
