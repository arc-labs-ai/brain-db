name: Docker publish

# Publishes the production brain-server image to GHCR (ghcr.io), the primary
# release artifact — self-hosters `docker run` it, and our own playground /
# gateway deploy pins the same tag, so cutting a release and shipping the
# deploy are one act. Runs only on version tags (v*): Brain is pre-release
# with no external users yet, so we don't want a public image cut from every
# commit to main. Tag a release only from a commit that already passed the
# main-branch CI workflow (ci.yml); this workflow builds the image but does
# not re-run the test suite.
#
# GHCR over Docker Hub: free for public images, GitHub-native auth via the
# job's GITHUB_TOKEN (no long-lived registry secret to rotate), and no
# anonymous pull-rate-limit pain for self-hosters.
#
# Each platform builds on its own native runner (amd64 on ubuntu-26.04,
# arm64 on the free-for-public-repos ubuntu-26.04-arm) rather than
# cross-building arm64 under QEMU on a single runner. The Dockerfile's
# builder stage compiles a large Rust workspace with native deps (cmake /
# build-essential, for candle + hnsw_rs), and QEMU-emulated compiles of
# workloads like that are known to blow up from minutes to hours (or time
# out outright) — native hardware avoids that entirely. Each build job
# pushes its image by digest only; the `merge` job assembles the two
# digests into one multi-arch manifest, applies the real tags, and cuts the
# GitHub Release that pins the published digest.

on:
  push:
    tags:
      - "v*"
  # Escape hatch. A tag pushed by release-please under the default
  # GITHUB_TOKEN does not raise a workflow-starting event, so the tag -> image
  # chain can silently not happen (it didn't for v0.1.0). This lets a
  # maintainer build and publish any existing version tag by hand without
  # deleting and re-pushing it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

# `packages: write` lets the job's GITHUB_TOKEN push to GHCR; `contents:
# write` lets the merge job create the GitHub Release for the tag.
permissions:
  contents: write
  packages: write

# A release publish shouldn't be interrupted mid-push by a newer tag (there
# usually isn't one), but group by ref so two accidental pushes of the same
# tag can't race each other.
concurrency:
  group: docker-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

# Lowercased owner keeps GHCR happy (ghcr.io rejects uppercase path
# segments); arc-labs-ai is already lowercase, so a bare interpolation is
# fine here.
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/brain-db

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # On a tag push this is already the tag; on a manual dispatch
          # github.ref is the branch the hatch was fired from, so the tag the
          # operator named is what must be built.
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive platform tag pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The merge job runs metadata-action too, but only to tag and annotate
      # the manifest LIST. Labels live in each platform image's own config, so
      # they have to be computed and applied here or the published image
      # carries none at all — which is what v0.1.0 shipped with: empty
      # version, revision and source. `source` in particular is what ties the
      # package back to this repo and lets a reader trace an image to a commit.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Nothing in this workflow started the image before. v0.1.0 shipped
      # unable to boot at all — the embedding model was not on the path the
      # server reads — and the GLiNER classifier tier was silently unloaded,
      # because a build that compiles is not a server that runs. Both would
      # have been caught here.
      #
      # Runs on the native runner, so the just-pushed digest for this platform
      # can be pulled and started directly. No secret needed: blackholing the
      # provider host makes Brain's boot credential preflight INCONCLUSIVE
      # rather than fatal, which is enough to reach shard init and load models.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          echo "::group::starting $IMG"
          docker run -d --name smoke \
            --security-opt seccomp=unconfined --ulimit memlock=-1 \
            --add-host=api.openai.com:127.0.0.1 \
            --add-host=api.anthropic.com:127.0.0.1 \
            -e BRAIN__LLM__API_KEY=smoke-probe-not-a-real-key \
            -e BRAIN__ADMIN__TOKEN=smoke-admin-token \
            "$IMG"
          echo "::endgroup::"

          # The image declares its own HEALTHCHECK (curl /healthz on 9091);
          # waiting on Docker's verdict tests that too, not just the route.
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo missing)"
            [ "$status" = "healthy" ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" != "running" ]; then
              echo "::error title=Smoke test failed::container exited before becoming healthy"
              docker logs smoke; docker rm -f smoke; exit 1
            fi
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" != "healthy" ]; then
            echo "::error title=Smoke test failed::never became healthy within 120s"
            docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' smoke || true
            docker logs smoke; docker rm -f smoke; exit 1
          fi

          # Both bundled models must actually load. Absence of the classifier is
          # not fatal to startup, so only an explicit check catches it — that is
          # exactly how v0.1.0 shipped with the tier silently unloaded.
          logs="$(docker logs smoke 2>&1)"
          for want in "loaded embedding model" "loaded gliner classifier" "brain-server listening"; do
            if ! grep -qF "$want" <<<"$logs"; then
              echo "::error title=Smoke test failed::missing from startup log: $want"
              echo "$logs" | tail -40; docker rm -f smoke; exit 1
            fi
          done

          if grep -q '"level":"ERROR"' <<<"$logs"; then
            echo "::error title=Smoke test failed::ERROR lines during startup"
            grep '"level":"ERROR"' <<<"$logs" | head -20; docker rm -f smoke; exit 1
          fi

          echo "healthy; both models loaded; no ERROR lines"
          docker rm -f smoke

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `value=` pins what semver parses. On a tag push github.ref_name is
          # already `vX.Y.Z`; on a manual dispatch it would be the branch the
          # hatch was fired from, which parses to no version at all and would
          # publish an image tagged only `latest`.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `${{ env.IMAGE }}` is substituted into the format string at the
      # workflow-expression level (before the shell runs), leaving exactly
      # one `%s` for printf to cycle across each digest filename glob-
      # expanded by `*`. Interpolating $IMAGE as a second printf argument
      # instead would add a second %s and misalign every pair after the
      # first digest.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          # The manifest-list digest is the one thing a deploy should pin —
          # `${IMAGE}@${DIGEST}` is immutable where a tag can be re-pushed.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}

      # Human-facing landing for the version: release-please owns the
      # changelog body (generate_release_notes fills the rest); here we pin
      # the exact image coordinates so a reader can copy a digest-pinned
      # `docker run` straight out of the release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          # release-please has already created the release for this tag and
          # filled it with the changelog. Without append_body the action finds
          # that existing release, drops the draft it built, and keeps the old
          # body — discarding everything below and still reporting success.
          # That is exactly what happened to v0.1.0: the release shipped with
          # no image coordinates at all. Appending preserves the changelog and
          # adds the pull instructions under it.
          append_body: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            Digest-pinned (immutable) for deploy manifests:

            ```
            ${{ env.IMAGE }}@${{ steps.inspect.outputs.digest }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.
            See [`DEPLOY.md`](DEPLOY.md) for self-host / compose instructions.
