name: Docker publish

# Publishes the production brain-server image to Docker Hub. Runs only on
# version tags (v*) — Brain is pre-release with no external users yet, so we
# don't want a public image cut from every commit to main. Tag a release
# only from a commit that already passed the main-branch CI workflow
# (ci.yml); this workflow builds the image but does not re-run the test
# suite.
#
# Each platform builds on its own native runner (amd64 on ubuntu-latest,
# arm64 on the free-for-public-repos ubuntu-24.04-arm) rather than
# cross-building arm64 under QEMU on a single runner. The Dockerfile's
# builder stage compiles a large Rust workspace with native deps (cmake /
# build-essential, for candle + hnsw_rs), and QEMU-emulated compiles of
# workloads like that are known to blow up from minutes to hours (or time
# out outright) — native hardware avoids that entirely. Each build job
# pushes its image by digest only; the `merge` job assembles the two
# digests into one multi-arch manifest and applies the real tags.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A release publish shouldn't be interrupted mid-push by a newer tag (there
# usually isn't one), but group by ref so two accidental pushes of the same
# tag can't race each other.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: arc-labs/brain

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Derive platform tag pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `${{ env.IMAGE }}` is substituted into the format string at the
      # workflow-expression level (before the shell runs), leaving exactly
      # one `%s` for printf to cycle across each digest filename glob-
      # expanded by `*`. Interpolating $IMAGE as a second printf argument
      # instead would add a second %s and misalign every pair after the
      # first digest.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/${{ env.IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        run: docker buildx imagetools inspect docker.io/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
