# Prometheus alerting rules for Brain.
#
# Validated in CI by crates/brain-server/tests/alerts.rs, which checks the
# file's shape, the required-alert set, the severity set, AND that every
# metric an expr references is one the server actually emits (parsed from
# crates/brain-server/src/metrics/format.rs) — so an alert can never again
# silently reference a metric that does not exist.
# `promtool check rules config/monitoring/alerts/brain-rules.yml` is the
# authoritative PromQL check when the Prometheus toolchain is available.
#
# Severities: critical (page now), high (page in hours), medium (ticket),
# low (informational). Thresholds are starting points — tune per deployment.
groups:
  - name: brain-critical
    rules:
      - alert: BrainSubstrateDown
        expr: up{job="brain-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Brain server is unreachable"
          description: >-
            No successful scrape of {{ $labels.instance }} for 1m — the server
            is down, wedged, or fail-stopped. Brain halts the process on a
            fail-stop invariant violation (CRC mismatch, WAL fsync failure),
            so a hard halt surfaces here as a scrape failure.

      - alert: BrainHighErrorRate
        expr: |
          sum(rate(brain_request_total{status="error"}[5m]))
            / clamp_min(sum(rate(brain_request_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Brain error-response rate above 5%"
          description: "Over 5% of dispatched requests terminated in an ERROR status over the last 5m."

      - alert: BrainWorkerErrors
        expr: increase(brain_worker_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A Brain correctness/maintenance worker is erroring"
          description: >-
            Worker {{ $labels.worker }} on shard {{ $labels.shard }} reported
            cycle errors in the last 15m. The always-on set includes
            correctness workers (ForgetCascade, SchemaMigration, StatementEmbed);
            errors here degrade durability/correctness posture.

  - name: brain-high
    rules:
      - alert: BrainHighLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(brain_request_duration_ms_bucket[5m]))) > 50
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Brain p99 request latency above 50ms"
          description: "p99 request latency has exceeded the 50ms target for 10m."

      - alert: BrainWorkerStuck
        expr: sum(rate(brain_worker_cycles_total[15m])) == 0
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "Brain background workers have stalled"
          description: "No worker cycle completed anywhere in the last 15m — decay/consolidation/extraction/embed may be wedged."

      - alert: BrainExtractorApplyDropping
        expr: increase(brain_extractor_apply_dropped_total[15m]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Extracted typed-graph items are failing to persist"
          description: >-
            The apply pass dropped real extracted items on shard
            {{ $labels.shard }} (reason={{ $labels.reason }}) in the last 15m.
            Any nonzero value is signal loss — memories were written but their
            derived statements/relations did not land.

  - name: brain-medium
    rules:
      - alert: BrainHighTombstoneRatio
        expr: brain_hnsw_tombstone_ratio > 0.3
        for: 30m
        labels:
          severity: medium
        annotations:
          summary: "HNSW tombstone ratio above 30%"
          description: "Index is accumulating tombstones — recall latency/quality will degrade until maintenance compacts it."

      - alert: BrainArenaNearCapacity
        expr: brain_arena_used_bytes / clamp_min(brain_arena_capacity_bytes, 1) > 0.9
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "Arena above 90% capacity"
          description: >-
            Shard {{ $labels.shard }} arena is over 90% full. When the arena
            fills, encodes fail — provision more capacity or age out memories.

      - alert: BrainStatementEmbedErrors
        expr: increase(brain_statement_embed_errors_total[15m]) > 0
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "Statement-embed worker is failing"
          description: >-
            The StatementEmbedWorker hit embedder batch failures on shard
            {{ $labels.shard }} in the last 15m — new statements are not
            entering the statement HNSW, so graph recall degrades.

      - alert: BrainConnectionsChurning
        expr: rate(brain_connections_closed_total[5m]) > 20
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "Connections are churning"
          description: "Clients are opening and closing connections rapidly (>20/s) — check client pooling and admission limits."

  - name: brain-low
    rules:
      - alert: BrainConfigChanged
        expr: changes(brain_config_info[1h]) > 0
        for: 0m
        labels:
          severity: low
        annotations:
          summary: "Brain configuration changed"
          description: "The running config fingerprint changed in the last hour — confirm the change was intentional."

      - alert: BrainExtractorBackpressure
        expr: increase(brain_extractor_drops_total[1h]) > 0
        for: 0m
        labels:
          severity: low
        annotations:
          summary: "Extractor queue dropped items"
          description: "The extractor worker dropped enqueues in the last hour (back-pressure or a full channel)."

      - alert: BrainTraceExportFailing
        expr: increase(brain_tracing_export_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: low
        annotations:
          summary: "OTLP trace export is failing"
          description: >-
            The OpenTelemetry exporter reported failed/timed-out export
            attempts in the last 15m — traces are not reaching the collector.
